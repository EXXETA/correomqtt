# Mosquitto config for the CI broker-integration job (see .github/workflows/rust-build.yml).
# Anonymous access on an all-interfaces listener so the containerized broker is
# reachable from the test runner. CI-only; not a production configuration.
listener 1883 0.0.0.0
allow_anonymous true

# CI injects a short-lived synthetic certificate at this mount point.
listener 8883 0.0.0.0
certfile /mosquitto/certs/server.pem
keyfile /mosquitto/certs/server.key
