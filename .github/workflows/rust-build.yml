name: Rust Desktop Build

on:
  push:
    branches: [ rust, "release/**" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, lint and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      # Run the workspace test suite on every target OS so platform-specific
      # code (path handling, file permissions, the per-OS secret store) is
      # exercised, not just Linux. fmt/clippy run once on Linux only.
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, macos-26, windows-2025 ]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Show Rust toolchain
        run: |
          rustup show active-toolchain
          rustc -vV
          cargo --version

      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libdbus-1-dev \
            libgl1-mesa-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            pkg-config

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-check-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-check-

      - name: Verify lockfile
        run: cargo fetch --locked

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Clippy
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test workspace
        run: cargo test --workspace --locked

  package:
    name: Package ${{ matrix.platform }} (${{ matrix.target }})
    needs: check
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: correomqtt-linux-x86_64-unsigned-beta
          - platform: windows
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            artifact: correomqtt-windows-x86_64-unsigned-beta
          - platform: macos
            runner: macos-15
            target: aarch64-apple-darwin
            artifact: correomqtt-macos-aarch64-unsigned-beta
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libdbus-1-dev \
            libgl1-mesa-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            pkg-config

      - name: Install nfpm for DEB/RPM packaging
        if: runner.os == 'Linux'
        run: |
          curl -sSfL -o /tmp/nfpm.deb https://github.com/goreleaser/nfpm/releases/download/v2.47.0/nfpm_2.47.0_amd64.deb
          echo "3f1cf344bd0b57373ca55636a78c08b0491f7293d609a456a9ac3b0b150fda97  /tmp/nfpm.deb" | sha256sum -c -
          sudo dpkg -i /tmp/nfpm.deb

      - name: Install WiX for MSI packaging
        if: runner.os == 'Windows'
        run: |
          dotnet tool install --global wix --version 6.0.2
          Add-Content $env:GITHUB_PATH "$env:USERPROFILE\.dotnet\tools"
          & "$env:USERPROFILE\.dotnet\tools\wix.exe" --version

      - name: Show package provenance
        run: |
          echo "commit=${{ github.sha }}"
          echo "runner=${{ matrix.runner }}"
          echo "target=${{ matrix.target }}"
          echo "command=cargo xtask package-smoke --target ${{ matrix.target }} --out-dir dist/beta/${{ matrix.target }} --require-installers"
          rustup show active-toolchain
          rustc -vV
          cargo --version

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Add validated WASM target
        run: rustup target add wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-

      - name: Verify target lockfile
        run: cargo fetch --locked --target ${{ matrix.target }}

      - name: Build and verify unsigned beta package
        run: cargo xtask package-smoke --target ${{ matrix.target }} --out-dir dist/beta/${{ matrix.target }} --require-installers

      - name: List package outputs
        run: ls dist/beta/${{ matrix.target }}

      - name: Upload unsigned beta package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/beta/${{ matrix.target }}/*.zip
            dist/beta/${{ matrix.target }}/*.zip.sha256
            dist/beta/${{ matrix.target }}/*.dmg
            dist/beta/${{ matrix.target }}/*.dmg.sha256
            dist/beta/${{ matrix.target }}/*.deb
            dist/beta/${{ matrix.target }}/*.deb.sha256
            dist/beta/${{ matrix.target }}/*.rpm
            dist/beta/${{ matrix.target }}/*.rpm.sha256
            dist/beta/${{ matrix.target }}/*.msi
            dist/beta/${{ matrix.target }}/*.msi.sha256
            dist/beta/${{ matrix.target }}/SHA256SUMS

  plugin-release:
    name: Plugin release artifacts
    needs: [check, package]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read

    env:
      RELEASE_ASSET_BASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Verify tag matches package version
        shell: bash
        run: |
          package_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "correo-app") | .version')"
          test "$GITHUB_REF_NAME" = "v$package_version"

      - name: Show plugin release provenance
        run: |
          echo "commit=${{ github.sha }}"
          echo "tag=${{ github.ref_name }}"
          echo "command=cargo xtask plugin-release --out-dir dist/plugins --asset-base-url $RELEASE_ASSET_BASE_URL"
          rustup show active-toolchain
          rustc -vV
          cargo --version

      - name: Add WASM target
        run: rustup target add wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-plugins-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-plugins-

      - name: Verify plugin target lockfile
        run: cargo fetch --locked --target wasm32-unknown-unknown

      - name: Build plugin release artifacts
        run: cargo xtask plugin-release --out-dir dist/plugins --asset-base-url "$RELEASE_ASSET_BASE_URL"

      - name: List plugin outputs
        run: ls dist/plugins

      - name: Download verified package artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --dir dist/packages

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            if [ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft')" != true ]; then
              echo "refusing to replace assets on published release $GITHUB_REF_NAME" >&2
              exit 1
            fi
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --draft --generate-notes
          fi

      - name: Remove stale draft assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' |
            while IFS= read -r asset; do
              gh release delete-asset "$GITHUB_REF_NAME" "$asset" --yes
            done

      - name: Upload complete release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            dist/plugins/*.zip \
            dist/plugins/default-repo.json \
            dist/packages/*/*.{zip,zip.sha256,dmg,dmg.sha256,deb,deb.sha256,rpm,rpm.sha256,msi,msi.sha256}

      - name: Smoke published plugin release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_dir="$(mktemp -d)"
          profile_dir="$(mktemp -d)"
          trap 'rm -rf "$release_dir" "$profile_dir"' EXIT
          gh release download "$GITHUB_REF_NAME" --dir "$release_dir" --pattern '*.zip' --pattern default-repo.json
          cargo xtask plugin-release-smoke --download-dir "$release_dir" --profile-dir "$profile_dir" --asset-base-url "$RELEASE_ASSET_BASE_URL"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --draft=false
