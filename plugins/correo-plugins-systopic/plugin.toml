manifest_version = 1
id = "org.correomqtt.plugins.system-topic"
name = "System Topics"
version = "0.1.0"
description = "Adds a connection header action that opens live $SYS broker metrics."
provider = "CorreoMQTT"
license = "GPL-3.0-or-later"
compatible_correomqtt = ">=1.0.0, <2.0.0"

[capabilities]
hooks = []

[capabilities.host]
filesystem = false
network = false
secrets = false
mqtt = true
ui = true

[[connection_header_actions]]
id = "system-topics"
label = "$SYS"
tooltip = "Open system topics"
requires_connected = true

[config_schema]
schema_version = 1
document = { type = "object", additionalProperties = false }
